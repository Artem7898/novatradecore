name: Scheduled dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt --output-file locked-requirements.txt
          uv run --frozen pip-audit --disable-pip --no-deps --require-hashes -r locked-requirements.txt
