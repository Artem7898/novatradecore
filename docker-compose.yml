name: novatradecore

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-novatrade}
      POSTGRES_USER: ${DATABASE_USER:-nova}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run make init to generate .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run make init to generate .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    env_file: ${ENV_FILE:-.env}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./trades:/app/trades:ro
      - static_data:/app/staticfiles
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/config", "--reload-dir", "/app/trades"]
    restart: unless-stopped

volumes:
  postgres_data:
  static_data:
