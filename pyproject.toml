[project]
name = "novatradecore"
version = "2.0.0"
description = "Validated trade ingestion and deterministic risk assessment with Django"
requires-python = ">=3.12,<3.14"
authors = [{name = "Artem Alimpiev", email = "alimpievne@gmail.com"}]
dependencies = [
    "Django>=5.2.17,<5.3",
    "uvicorn[standard]>=0.35,<1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
    "psycopg[binary]>=3.2.10,<4",
    "redis>=6.4,<8",
    "structlog>=25.4,<27",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8,<2",
    "build>=1.3,<2",
    "django-stubs>=5.2,<6",
    "hypothesis>=6.141,<7",
    "pip-audit>=2.9,<3",
    "pre-commit>=4.3,<5",
    "pyright>=1.1.407,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=6,<8",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
]
load = ["locust>=2.41,<3"]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "trades*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["integration: requires PostgreSQL or Redis", "postgresql: PostgreSQL-only database behavior"]
filterwarnings = ["error", "ignore:The default URLField.assume_scheme will change from.*:django.utils.deprecation.RemovedInDjango60Warning"]

[tool.coverage.run]
branch = true
source = ["trades"]
omit = ["*/migrations/*", "*/admin.py", "*/apps.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.pyright]
include = ["trades", "config"]
exclude = ["**/migrations/**", ".venv", "build"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"trades/migrations/*.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
